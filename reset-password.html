<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Don't cache the HTML page itself (Ahmed, 2026-08-19). Asset links carry
         a ?v=<hash> so CSS/JS always load fresh, but the browser was still
         serving a stale cached COPY OF THE PAGE (old markup persisted after a
         fix). Revalidating the HTML means every reload picks up the current
         page — and thus the current versioned asset links — with no hard-refresh. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>إعادة تعيين كلمة المرور | جاد</title>
    <meta name="description" content="اختر كلمة مرور جديدة لحسابك في جاد." />
    <meta name="theme-color" content="#00451C" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="إعادة تعيين كلمة المرور | جاد" />
    <meta property="og:description" content="اختر كلمة مرور جديدة لحسابك في جاد." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="جاد" />
    <meta property="og:locale" content="ar_EG" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Jaad design system. Tailwind is COMPILED AT BUILD TIME by
         `npm run css` (config: tailwind.config.js) into tailwind.css. It used
         to be the Play CDN, which Tailwind itself warns against in production:
         that shipped ~120KB of JavaScript which then had to scan the DOM and
         generate the stylesheet on every visit, so nothing was styled until it
         finished — a flash of unstyled content on exactly the slow mobile
         connections this storefront is for. Now it is one 30KB cacheable file.

         ORDER IS LOAD-BEARING: tailwind.css first, styles.css second.
         styles.css contains rules whose whole purpose is to beat a utility
         ([hidden] !important, the focus ring re-armed over `outline-none`,
         the sticky-nav selector). Reverse these two and they stop working. -->
    <link rel="stylesheet" href="tailwind.css?v=1f467ff2" />
    <link rel="stylesheet" href="styles.css?v=39c3d8eb" />
    <!-- The client's 3D leaf mark as the tab icon (Ahmed, 2026-08-05) — the
         same spec-leaf.png the mega-panel bullets and product benefits use, so
         the favicon is a recognisable brand glyph rather than the white
         wordmark, which reads as a blank sliver at 16px. -->
    <link rel="icon" type="image/svg+xml" href="images/jaad/brand/favicon.svg" />
    <!-- The English dictionary, generated by build/i18n.py. Also `defer`, and
         listed FIRST: deferred scripts run in document order, so this has
         always defined window.JAAD_I18N by the time scripts.js boots and
         merges it. A plain script rather than a fetch, so the language switch
         still works from file://. -->
    <script defer src="i18n-en.js?v=1500250b"></script>
    <script defer src="scripts.js?v=fc0bc880"></script>
  </head>
  <body data-page="reset-password" data-path="/reset-password" class="antialiased bg-white">
    <!-- First focusable thing on the page. The header is three bands and a
         mega-menu, so a keyboard shopper otherwise tabbed through the whole
         of it on every page before reaching any content. Visually hidden
         until focused. -->
    <a href="#main" class="skip-link">تخطي إلى المحتوى</a>

    <!-- Shared header is injected here by scripts.js -->
    <div id="site-header"></div>

    <main id="main" tabindex="-1" class="overflow-x-clip">
      <section data-reveal class="pt-6">
        <div class="flex flex-col gap-4 mx-auto px-4 max-w-[1536px]">
          <nav aria-label="مسار التنقل" class="flex flex-wrap items-center gap-2 text-sm"><a href="index.html" class="link-sweep text-neutral-secondary hover:text-primary transition-colors">الرئيسية</a><span aria-hidden="true" class="text-neutral-outline">/</span><span class="font-semibold text-[#003616]">إعادة تعيين كلمة المرور</span></nav>
        </div>
      </section>

      <section data-reveal class="py-8 xl:py-12">
        <div class="items-stretch gap-6 xl:gap-8 grid grid-cols-1 max-w-[560px] mx-auto mx-auto px-4 max-w-[1536px]">
          
          <!-- The two auth cards are equal-height (items-stretch on the grid).
               Titles pin to the top (aligned); the sign-in page passes
               form_contents=True and its own flex-1 regions so the CTA centres
               on the same line as the create-account button (Ahmed, 2026-08-04). -->
          <div class="flex flex-col gap-6 bg-white shadow-custom4 p-8 xl:p-10 rounded-[20px] min-w-0">
            
            <h1 class="font-bold text-[#003616] text-2xl xl:text-3xl text-center">إعادة تعيين كلمة المرور</h1>
            <form class="flex flex-col gap-5">
              <p class="text-neutral-secondary text-sm text-center leading-7">
                اختر كلمة مرور جديدة لحسابك.
              </p>

                <div class="flex flex-col gap-1.5">
                  <label for="password" class="font-medium text-neutral-secondary text-sm">كلمة السر الجديدة</label>
                  <div class="relative">
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           class="bg-white px-4 py-3 pe-12 border-2 border-neutral-divider focus:border-cta rounded-xl outline-none w-full text-[#003616] text-base transition-colors" />
                    <!-- data-pw-toggle, NOT data-reveal: the site-wide entrance
                         animation keys off [data-reveal] on sections, and an eye
                         button that also carried data-reveal got swept into it —
                         initReveal rewrote its attribute to "in" (breaking the
                         toggle's input lookup) and the reveal transform overrode
                         the button's -translate-y-1/2, dropping the icon to the
                         field's bottom edge (Ahmed, 2026-08-03). -->
                    <button type="button" data-pw-toggle="password" aria-label="إظهار كلمة السر"
                            class="top-1/2 end-1 absolute place-items-center grid w-11 h-11 text-neutral-secondary hover:text-cta -translate-y-1/2 transition-colors">
                      <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.7"/>
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
                      </svg>
                    </button>
                  </div>
                </div>

                <div class="flex flex-col gap-1.5">
                  <label for="password-confirm" class="font-medium text-neutral-secondary text-sm">تأكيد كلمة السر</label>
                  <div class="relative">
                    <input type="password" id="password-confirm" name="password-confirm" required autocomplete="current-password"
                           class="bg-white px-4 py-3 pe-12 border-2 border-neutral-divider focus:border-cta rounded-xl outline-none w-full text-[#003616] text-base transition-colors" />
                    <!-- data-pw-toggle, NOT data-reveal: the site-wide entrance
                         animation keys off [data-reveal] on sections, and an eye
                         button that also carried data-reveal got swept into it —
                         initReveal rewrote its attribute to "in" (breaking the
                         toggle's input lookup) and the reveal transform overrode
                         the button's -translate-y-1/2, dropping the icon to the
                         field's bottom edge (Ahmed, 2026-08-03). -->
                    <button type="button" data-pw-toggle="password-confirm" aria-label="إظهار كلمة السر"
                            class="top-1/2 end-1 absolute place-items-center grid w-11 h-11 text-neutral-secondary hover:text-cta -translate-y-1/2 transition-colors">
                      <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.7"/>
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
                      </svg>
                    </button>
                  </div>
                </div>
              <button type="submit" class="bg-cta hover:bg-cta-hover py-4 rounded-full font-semibold text-white text-base transition-colors">حفظ كلمة المرور</button>
            </form>
            
          </div>
        </div>
      </section>
    </main>

    <!-- Shared footer is injected here by scripts.js -->
    <div id="site-footer"></div>
  </body>
</html>
