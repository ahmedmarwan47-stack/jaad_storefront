<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Don't cache the HTML page itself (Ahmed, 2026-08-19). Asset links carry
         a ?v=<hash> so CSS/JS always load fresh, but the browser was still
         serving a stale cached COPY OF THE PAGE (old markup persisted after a
         fix). Revalidating the HTML means every reload picks up the current
         page — and thus the current versioned asset links — with no hard-refresh. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>رمز التحقق | جاد</title>
    <meta name="description" content="أدخل رمز التحقق المرسل إلى رقم موبايلك لإتمام تسجيل الدخول في جاد." />
    <meta name="theme-color" content="#00451C" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="رمز التحقق | جاد" />
    <meta property="og:description" content="أدخل رمز التحقق المرسل إلى رقم موبايلك لإتمام تسجيل الدخول في جاد." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="جاد" />
    <meta property="og:locale" content="ar_EG" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Jaad design system. Tailwind is COMPILED AT BUILD TIME by
         `npm run css` (config: tailwind.config.js) into tailwind.css. It used
         to be the Play CDN, which Tailwind itself warns against in production:
         that shipped ~120KB of JavaScript which then had to scan the DOM and
         generate the stylesheet on every visit, so nothing was styled until it
         finished — a flash of unstyled content on exactly the slow mobile
         connections this storefront is for. Now it is one 30KB cacheable file.

         ORDER IS LOAD-BEARING: tailwind.css first, styles.css second.
         styles.css contains rules whose whole purpose is to beat a utility
         ([hidden] !important, the focus ring re-armed over `outline-none`,
         the sticky-nav selector). Reverse these two and they stop working. -->
    <link rel="stylesheet" href="tailwind.css?v=4fbb0733" />
    <link rel="stylesheet" href="styles.css?v=effead21" />
    <!-- The client's 3D leaf mark as the tab icon (Ahmed, 2026-08-05) — the
         same spec-leaf.png the mega-panel bullets and product benefits use, so
         the favicon is a recognisable brand glyph rather than the white
         wordmark, which reads as a blank sliver at 16px. -->
    <link rel="icon" type="image/svg+xml" href="images/jaad/brand/favicon.svg" />
    <!-- The English dictionary, generated by build/i18n.py. Also `defer`, and
         listed FIRST: deferred scripts run in document order, so this has
         always defined window.JAAD_I18N by the time scripts.js boots and
         merges it. A plain script rather than a fetch, so the language switch
         still works from file://. -->
    <script defer src="i18n-en.js?v=365b3d71"></script>
    <script defer src="scripts.js?v=5bd2104c"></script>
  </head>
  <body data-page="verify" data-path="/verify" class="antialiased bg-white">
    <!-- First focusable thing on the page. The header is three bands and a
         mega-menu, so a keyboard shopper otherwise tabbed through the whole
         of it on every page before reaching any content. Visually hidden
         until focused. -->
    <a href="#main" class="skip-link">تخطي إلى المحتوى</a>

    <!-- Shared header is injected here by scripts.js -->
    <div id="site-header"></div>

    <main id="main" tabindex="-1" class="overflow-x-clip">

      <section data-reveal class="py-8 xl:py-12">
        <div class="items-stretch gap-6 xl:gap-8 grid grid-cols-1 max-w-[560px] mx-auto mx-auto px-4 max-w-[1536px]">
          
          <!-- The two auth cards are equal-height (items-stretch on the grid).
               Titles pin to the top (aligned); the sign-in page passes
               form_contents=True and its own flex-1 regions so the CTA centres
               on the same line as the create-account button (Ahmed, 2026-08-04). -->
          <div class="flex flex-col gap-6 bg-white shadow-custom4 p-8 xl:p-10 rounded-[20px] min-w-0">
            <div class="flex justify-center"><img src="images/jaad/icons/otp-3d.png" alt="" class="w-20 h-20 object-contain" /></div>
            <h1 class="font-medium text-heading text-[32px] md:text-[40px] leading-[1.2] text-center">التحقق من رقم الموبايل</h1>
            <form class="flex flex-col gap-5" data-otp-form>
              <p class="text-muted text-sm text-center leading-6">
                أدخل رمز التحقق المكوّن من 6 أرقام المُرسل إلى
                <span class="font-semibold text-ink latin" data-otp-mobile>—</span>
              </p>
              <div class="flex gap-2 sm:gap-3" dir="ltr">
<input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" placeholder=" " data-otp-box aria-label="خانة رقم 1" class="otp-box flex-1 min-w-0 h-14 rounded-xl text-center font-bold text-ink text-2xl latin" /><input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" placeholder=" " data-otp-box aria-label="خانة رقم 2" class="otp-box flex-1 min-w-0 h-14 rounded-xl text-center font-bold text-ink text-2xl latin" /><input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" placeholder=" " data-otp-box aria-label="خانة رقم 3" class="otp-box flex-1 min-w-0 h-14 rounded-xl text-center font-bold text-ink text-2xl latin" /><input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" placeholder=" " data-otp-box aria-label="خانة رقم 4" class="otp-box flex-1 min-w-0 h-14 rounded-xl text-center font-bold text-ink text-2xl latin" /><input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" placeholder=" " data-otp-box aria-label="خانة رقم 5" class="otp-box flex-1 min-w-0 h-14 rounded-xl text-center font-bold text-ink text-2xl latin" /><input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" placeholder=" " data-otp-box aria-label="خانة رقم 6" class="otp-box flex-1 min-w-0 h-14 rounded-xl text-center font-bold text-ink text-2xl latin" />
              </div>
              <p data-otp-msg hidden class="font-semibold text-error text-sm text-center"></p>
              <button type="submit" data-otp-submit class="btn-elevate bg-cta hover:bg-cta-hover py-4 rounded-full font-semibold text-white text-base transition-colors">تأكيد وتسجيل الدخول</button>
              <button type="button" data-resend-otp class="link-sweep self-center font-semibold text-cta text-sm">إعادة إرسال الرمز</button>
            </form>
            
          </div>
        </div>
      </section>
    </main>

    <!-- Shared footer is injected here by scripts.js -->
    <div id="site-footer"></div>
  </body>
</html>
