<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Don't cache the HTML page itself (Ahmed, 2026-08-19). Asset links carry
         a ?v=<hash> so CSS/JS always load fresh, but the browser was still
         serving a stale cached COPY OF THE PAGE (old markup persisted after a
         fix). Revalidating the HTML means every reload picks up the current
         page — and thus the current versioned asset links — with no hard-refresh. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>طريقة الدفع | جاد</title>
    <meta name="description" content="اختر طريقة الدفع وأكد طلبك من جاد." />
    <meta name="theme-color" content="#00451C" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="طريقة الدفع | جاد" />
    <meta property="og:description" content="اختر طريقة الدفع وأكد طلبك من جاد." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="جاد" />
    <meta property="og:locale" content="ar_EG" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Jaad design system. Tailwind is COMPILED AT BUILD TIME by
         `npm run css` (config: tailwind.config.js) into tailwind.css. It used
         to be the Play CDN, which Tailwind itself warns against in production:
         that shipped ~120KB of JavaScript which then had to scan the DOM and
         generate the stylesheet on every visit, so nothing was styled until it
         finished — a flash of unstyled content on exactly the slow mobile
         connections this storefront is for. Now it is one 30KB cacheable file.

         ORDER IS LOAD-BEARING: tailwind.css first, styles.css second.
         styles.css contains rules whose whole purpose is to beat a utility
         ([hidden] !important, the focus ring re-armed over `outline-none`,
         the sticky-nav selector). Reverse these two and they stop working. -->
    <link rel="stylesheet" href="tailwind.css?v=344f3eef" />
    <link rel="stylesheet" href="styles.css?v=464d60e4" />
    <!-- The client's 3D leaf mark as the tab icon (Ahmed, 2026-08-05) — the
         same spec-leaf.png the mega-panel bullets and product benefits use, so
         the favicon is a recognisable brand glyph rather than the white
         wordmark, which reads as a blank sliver at 16px. -->
    <link rel="icon" type="image/svg+xml" href="images/jaad/brand/favicon.svg" />
    <!-- The English dictionary, generated by build/i18n.py. Also `defer`, and
         listed FIRST: deferred scripts run in document order, so this has
         always defined window.JAAD_I18N by the time scripts.js boots and
         merges it. A plain script rather than a fetch, so the language switch
         still works from file://. -->
    <script defer src="i18n-en.js?v=b0628955"></script>
    <script defer src="scripts.js?v=15f8115d"></script>
  </head>
  <body data-page="checkout" data-path="/payment" class="antialiased bg-white">
    <!-- First focusable thing on the page. The header is three bands and a
         mega-menu, so a keyboard shopper otherwise tabbed through the whole
         of it on every page before reaching any content. Visually hidden
         until focused. -->
    <a href="#main" class="skip-link">تخطي إلى المحتوى</a>

    <!-- Shared header is injected here by scripts.js -->
    <div id="site-header"></div>

    <main id="main" tabindex="-1" class="overflow-x-clip">
      <section data-reveal class="py-8">
        <div class="items-start gap-10 grid grid-cols-1 lg:grid-cols-[1fr_380px] mx-auto px-4 max-w-[1100px]">

          <div class="flex flex-col gap-3 order-1 lg:order-none lg:col-span-2 min-w-0">
            <h1 class="font-medium text-heading text-[32px] md:text-[40px] leading-[1.2]">طريقة الدفع</h1>
            <nav aria-label="خطوات الشراء" class="flex flex-wrap items-center gap-2"><a href="checkout.html" class="flex items-center gap-2 rounded-md focus-visible:outline-none"><span class="place-items-center grid rounded-full size-5 text-xs latin bg-mint text-heading">✓</span><span class="text-heading text-sm link-sweep">بيانات شخصية</span></a><span aria-hidden="true" class="text-outline">/</span><span class="flex items-center gap-2"><span class="place-items-center grid rounded-full size-5 text-xs latin bg-cta text-white">2</span><span class="font-semibold text-ink text-sm">طريقة الدفع</span></span></nav>
          </div>

          <!-- RTL start: form -->
          <div class="flex flex-col gap-8 order-3 lg:order-none min-w-0">
            <form class="flex flex-col gap-8">
              <fieldset class="flex flex-col gap-4">
                <legend class="mb-3 font-bold text-ink text-lg">اختر طريقة الدفع</legend>
                <div class="flex flex-col gap-4">

                  <!-- Card leads the list AND is the default (Ahmed,
                       2026-08-23). It used to lead visually while COD kept the
                       `checked`, so the row the eye landed on first was not the
                       row that was selected — and the card form below it stayed
                       shut on arrival. Card is now genuinely the pre-selected
                       method and its fields are open underneath. COD remains
                       one tap away, and its gift-order block (below) is
                       unaffected: that rule only ever fires when COD is the
                       chosen row. -->
                  <div class="flex">

                <!-- min-w-0 on BOTH nested flex children. A flex item's
                     min-width is `auto`, so without these the label column
                     cannot shrink below its longest line and pushes the whole
                     checkout form wider than its grid track. Caught at 375 in
                     English, where the form ran 31px over and the page's
                     `overflow-x-hidden` swallowed it — clipped copy that no
                     amount of scrolling reveals, which is exactly why
                     CLAUDE.md calls this the most common bug class here.
                     Arabic never showed it: "أرسل الطلب كهدية لشخص تحبه" is
                     simply shorter than "Send this order as a gift to someone
                     you love". Latent until the site actually translated. -->
                <label class="flex-1 min-w-0 cursor-pointer">
                  <input type="radio" name="payment-method" value="card" class="peer sr-only" checked />
                  <span class="flex justify-between items-center gap-3 bg-white px-5 py-4 border border-divider peer-checked:border-primary peer-checked:bg-primary-50 rounded-2xl transition-colors h-full">
                    <span class="radio-card__body flex items-center gap-3 min-w-0">
                      <span class="text-cta shrink-0"><span class="flex items-center gap-1.5 shrink-0"><img src="images/jaad/payments/pay-visa.svg" alt="" class="h-6 w-auto object-contain" /><img src="images/jaad/payments/pay-mastercard.svg" alt="" class="h-6 w-auto object-contain" /></span></span>
                      <span class="flex flex-col min-w-0">
                        <span class="font-semibold text-ink text-base">بطاقة ائتمان</span>
                        <span class="text-muted text-xs">فيزا أو ماستركارد</span>
                      </span>
                    </span>
                    <span class="radio-dot shrink-0" aria-hidden="true"></span>
                  </span>
                </label>
                  </div>

                  <!-- The card form. `data-card-fields` is revealed/hidden by
                       scripts.js off the payment-method radios, so it is open on
                       arrival (card is the default) and folds away the moment
                       another method is chosen — no orphan card form under a
                       cash order. READ THE MODULE DOCSTRING before wiring this
                       to anything: it is a prototype of a gateway screen, not a
                       gateway. -->
                  <div data-card-fields class="flex flex-col gap-4 bg-cream mx-1 p-5 rounded-2xl">

                    <div class="flex flex-col gap-1.5">
                      <label for="card-number" class="font-medium text-muted text-sm">رقم البطاقة</label>
                      <div class="relative">
                        <input type="text" id="card-number" name="card-number" data-demo-card data-card-number
                               inputmode="numeric" maxlength="19" autocomplete="off"
                               dir="ltr" placeholder="1234 5678 9012 3456"
                               class="bg-white border border-divider rounded-2xl px-4 h-12 w-full text-ink text-base placeholder:text-muted outline-none focus:border-cta transition-colors latin pe-20" />
                        <span class="top-1/2 end-3 absolute flex items-center gap-1.5 -translate-y-1/2 pointer-events-none">
                          <img src="images/jaad/payments/pay-visa.svg" alt="" class="w-auto h-5 object-contain" />
                          <img src="images/jaad/payments/pay-mastercard.svg" alt="" class="w-auto h-5 object-contain" />
                        </span>
                      </div>
                    </div>

                <div class="flex flex-col gap-1.5 ">
                  <label for="card-name" class="font-medium text-muted text-sm">الاسم على البطاقة</label>
                  <input type="text" id="card-name" name="card-name" autocomplete="off"
                         value="" placeholder=""
                         class="bg-white border border-divider rounded-2xl px-4 h-12 w-full text-ink text-base placeholder:text-muted outline-none focus:border-cta transition-colors" />
                </div>
                    <div class="gap-4 grid grid-cols-2">

                    <div class="flex flex-col gap-1.5">
                      <label for="card-expiry" class="font-medium text-muted text-sm">تاريخ الانتهاء</label>
                      <input type="text" id="card-expiry" name="card-expiry" data-demo-card
                             inputmode="numeric" maxlength="5" autocomplete="off"
                             dir="ltr" placeholder="MM/YY" data-card-expiry
                             class="bg-white border border-divider rounded-2xl px-4 h-12 w-full text-ink text-base placeholder:text-muted outline-none focus:border-cta transition-colors latin" />
                    </div>

                    <div class="flex flex-col gap-1.5">
                      <label for="card-cvv" class="font-medium text-muted text-sm">رمز التحقق CVV</label>
                      <input type="text" id="card-cvv" name="card-cvv" data-demo-card
                             inputmode="numeric" maxlength="4" autocomplete="off"
                             dir="ltr" placeholder="123"
                             class="bg-white border border-divider rounded-2xl px-4 h-12 w-full text-ink text-base placeholder:text-muted outline-none focus:border-cta transition-colors latin" />
                    </div>
                    </div>
                  </div>

                  <!-- Cash on delivery is blocked for gift orders, which is not
                       a new rule invented here: the gift card on the previous
                       screen already states it ("الدفع عند الاستلام غير متاح
                       لطلبات الهدايا"). Until now that was a promise with
                       nothing enforcing it, because there was no payment step
                       for it to apply to. scripts.js reads the gift flag saved
                       on checkout and blocks this row on load. -->
                  <div class="flex" data-cod-option>

                <!-- min-w-0 on BOTH nested flex children. A flex item's
                     min-width is `auto`, so without these the label column
                     cannot shrink below its longest line and pushes the whole
                     checkout form wider than its grid track. Caught at 375 in
                     English, where the form ran 31px over and the page's
                     `overflow-x-hidden` swallowed it — clipped copy that no
                     amount of scrolling reveals, which is exactly why
                     CLAUDE.md calls this the most common bug class here.
                     Arabic never showed it: "أرسل الطلب كهدية لشخص تحبه" is
                     simply shorter than "Send this order as a gift to someone
                     you love". Latent until the site actually translated. -->
                <label class="flex-1 min-w-0 cursor-pointer">
                  <input type="radio" name="payment-method" value="cod" class="peer sr-only" />
                  <span class="flex justify-between items-center gap-3 bg-white px-5 py-4 border border-divider peer-checked:border-primary peer-checked:bg-primary-50 rounded-2xl transition-colors h-full">
                    <span class="radio-card__body flex items-center gap-3 min-w-0">
                      <span class="text-cta shrink-0"><svg viewBox="0 0 24 24" fill="none" class="w-6 h-6"><rect x="2" y="6" width="20" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.7"/><path d="M5 9.5v5M19 9.5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
                      <span class="flex flex-col min-w-0">
                        <span class="font-semibold text-ink text-base">الدفع عند الاستلام</span>
                        <span class="text-muted text-xs">ادفع نقداً عند وصول طلبك</span>
                      </span>
                    </span>
                    <span class="radio-dot shrink-0" aria-hidden="true"></span><span class="blocked-note shrink-0 text-muted text-xs text-end leading-4">غير متاح لطلبات الهدايا</span>
                  </span>
                </label>
                  </div>

                  <div class="flex">

                <!-- min-w-0 on BOTH nested flex children. A flex item's
                     min-width is `auto`, so without these the label column
                     cannot shrink below its longest line and pushes the whole
                     checkout form wider than its grid track. Caught at 375 in
                     English, where the form ran 31px over and the page's
                     `overflow-x-hidden` swallowed it — clipped copy that no
                     amount of scrolling reveals, which is exactly why
                     CLAUDE.md calls this the most common bug class here.
                     Arabic never showed it: "أرسل الطلب كهدية لشخص تحبه" is
                     simply shorter than "Send this order as a gift to someone
                     you love". Latent until the site actually translated. -->
                <label class="flex-1 min-w-0 cursor-pointer">
                  <input type="radio" name="payment-method" value="etisalat" class="peer sr-only" />
                  <span class="flex justify-between items-center gap-3 bg-white px-5 py-4 border border-divider peer-checked:border-primary peer-checked:bg-primary-50 rounded-2xl transition-colors h-full">
                    <span class="radio-card__body flex items-center gap-3 min-w-0">
                      <span class="text-cta shrink-0"><span class="flex items-center gap-1.5 shrink-0"><img src="images/jaad/payments/pay-etisalat-cash.png" alt="" class="h-6 w-auto object-contain" /></span></span>
                      <span class="flex flex-col min-w-0">
                        <span class="font-semibold text-ink text-base">اتصالات كاش</span>
                        <span class="text-muted text-xs">ادفع من محفظتك على الموبايل</span>
                      </span>
                    </span>
                    <span class="radio-dot shrink-0" aria-hidden="true"></span>
                  </span>
                </label>
                  </div>
                </div>
              </fieldset>

              <p class="flex items-start gap-2 bg-cream p-4 rounded-xl text-muted text-xs leading-5">
                <span aria-hidden="true">🔒</span>
                <span>بيانات الدفع تتم بشكل آمن عند تأكيد الطلب. لن نحفظ بيانات بطاقتك.</span>
              </p>

              <!-- Same gate as the other CTA: renderCart disables this on an
                   EMPTY basket, so payment cannot be the one door left open on
                   an empty order. -->
              <a href="thank-you.html" data-cart-checkout class="bg-cta hover:bg-cta-hover py-4 rounded-full w-full font-semibold text-white text-base text-center transition-colors">
                تأكيد الطلب
              </a>
              <!-- The "العودة لبيانات التوصيل" link under the CTA is gone
                   (Ahmed, 2026-08-23): the breadcrumb at the top of the page
                   already links "بيانات شخصية" back to exactly this destination,
                   and a second way back sitting directly beneath the confirm
                   button competed with it for the last press of the flow. -->
            </form>
          </div>


          <aside class="lg:top-4 lg:sticky flex flex-col gap-4 bg-white shadow-custom4 p-6 rounded-[20px] order-2 lg:order-none min-w-0">
            <div class="flex justify-between items-center gap-3">
              <h2 class="font-bold text-heading text-xl">ملخص السلة</h2>
              <a href="cart.html" class="link-sweep font-semibold text-cta text-sm">تعديل</a>
            </div>
            <div class="flex flex-col gap-4" data-cart-lines>
                <div data-cart-static class="flex items-center gap-3">
                  <img src="images/jaad/products-styled/1.jpg" alt="" class="cart-thumb bg-cream rounded-lg w-16 h-16 shrink-0" loading="lazy" />
                  <div class="flex flex-col flex-1 gap-0.5 min-w-0">
                    <span class="font-semibold text-ink text-sm line-clamp-2">بن فاتح سادة</span>
                  </div>
                  <span class="inline-flex items-end gap-0.5 shrink-0 bg-greenDeep shadow-[2px_3px_0px_#98CA55] px-1.5 rounded-tl-[14px] rounded-br-[14px] font-bold text-white latin"><span class="text-[11px] leading-[1.4]">EGP</span><span class="text-[16px] leading-none">45</span><span class="text-[11px] leading-[1.4]">.00</span></span>
                </div>
                <div data-cart-static class="flex items-center gap-3">
                  <img src="images/jaad/products-styled/2.jpg" alt="" class="cart-thumb bg-cream rounded-lg w-16 h-16 shrink-0" loading="lazy" />
                  <div class="flex flex-col flex-1 gap-0.5 min-w-0">
                    <span class="font-semibold text-ink text-sm line-clamp-2">بن وسط سادة</span>
                  </div>
                  <span class="inline-flex items-end gap-0.5 shrink-0 bg-greenDeep shadow-[2px_3px_0px_#98CA55] px-1.5 rounded-tl-[14px] rounded-br-[14px] font-bold text-white latin"><span class="text-[11px] leading-[1.4]">EGP</span><span class="text-[16px] leading-none">45</span><span class="text-[11px] leading-[1.4]">.00</span></span>
                </div>
            </div>
            
            <div class="pt-1">
              <div data-note class="flex flex-col gap-2">
                <button type="button" data-note-open class="flex items-center gap-2 self-start min-h-11 font-semibold text-cta text-sm">
                  <span class="place-items-center grid bg-cream rounded-full size-6 shrink-0"><span class="w-3.5 h-3.5"><svg viewBox="0 0 24 24" fill="none" class="w-full h-full"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span></span>
                  أضف ملاحظة على الطلب
                </button>
                <div data-note-edit hidden class="flex flex-col gap-2">
                  <!-- aria-label, not placeholder alone: a placeholder disappears
                       the moment you type, so it cannot be the accessible name. -->
                  <textarea rows="3" placeholder="أضف ملاحظة على طلبك" aria-label="ملاحظات على الطلب" data-order-note
                            class="bg-white border border-divider rounded-2xl px-4 py-3 w-full text-ink text-sm placeholder:text-muted outline-none focus:border-cta transition-colors"></textarea>
                  <!-- Compact buttons (Ahmed, 2026-08-04): the save was oversized
                       for a note editor. Padding-based height (~34px) — still well
                       above the 24px WCAG 2.5.8 floor. -->
                  <div class="flex items-center gap-1 self-end">
                    <button type="button" data-note-cancel class="px-3 py-1.5 font-semibold text-muted text-xs">إلغاء</button>
                    <button type="button" data-order-note-save class="bg-cta hover:bg-cta-hover px-4 py-1.5 rounded-full font-semibold text-white text-xs transition-colors">حفظ الملاحظة</button>
                  </div>
                </div>
                <!-- Filled note: reads as a standard input. The flex-1 button is
                     the edit trigger (clicking the note text reopens the editor);
                     the X removes it. Hover cue lives on `.note-filled`. -->
                <div data-note-view hidden class="note-filled flex items-center gap-2 bg-white px-3 py-2.5 border border-divider rounded-2xl transition-colors">
                  <span class="shrink-0 text-primary"><span class="block w-4 h-4"><svg viewBox="0 0 24 24" fill="none" class="w-full h-full"><rect x="4" y="3.5" width="16" height="17" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M8 8.5h8M8 12h8M8 15.5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span></span>
                  <button type="button" data-note-edit-btn class="flex-1 min-w-0 text-start text-ink text-sm truncate" aria-label="تعديل الملاحظة"><span data-note-text></span></button>
                  <button type="button" data-note-remove class="place-items-center grid shrink-0 rounded-full size-6 text-muted hover:text-error hover:bg-cream transition-colors" aria-label="حذف الملاحظة"><span class="w-3.5 h-3.5"><svg viewBox="0 0 24 24" fill="none" class="w-full h-full"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span></button>
                </div>
              </div>
            </div>
            <div class="flex flex-col gap-2 pt-3 border-divider border-t text-sm">
              <div class="flex justify-between">
                <span class="text-muted">مصاريف التوصيل</span>
                <span class="font-semibold text-ink latin" data-cart-delivery>EGP 30</span>
              </div>
              <div class="flex justify-between">
                <span class="text-muted">الإجمالي</span>
                <span class="font-semibold text-ink latin" data-cart-subtotal>EGP 90</span>
              </div>
              <div class="flex justify-between items-center" data-cart-discount-row hidden>
                <span class="text-muted">خصم المحفظة</span>
                <span class="inline-flex items-center h-[13px] -me-2 bg-mint px-2 rounded font-bold text-ink-800 text-sm latin" data-cart-discount></span>
              </div>
              <div class="flex justify-between items-center" data-cart-promo-row hidden>
                <span class="text-muted">خصم كود الخصم</span>
                <span class="inline-flex items-center h-[13px] -me-2 bg-mint px-2 rounded font-bold text-ink-800 text-sm latin" data-cart-promo-discount></span>
              </div>
            </div>
            <div class="flex justify-between items-center pt-3 border-divider border-t">
              <span class="font-bold text-ink text-base">الإجمالي</span>
              <span class="font-bold text-ink text-2xl latin" data-cart-total>EGP 120</span>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <!-- Shared footer is injected here by scripts.js -->
    <div id="site-footer"></div>
  </body>
</html>
