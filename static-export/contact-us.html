<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Don't cache the HTML page itself (Ahmed, 2026-08-19). Asset links carry
         a ?v=<hash> so CSS/JS always load fresh, but the browser was still
         serving a stale cached COPY OF THE PAGE (old markup persisted after a
         fix). Revalidating the HTML means every reload picks up the current
         page — and thus the current versioned asset links — with no hard-refresh. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>أتصل بنا | جاد</title>
    <meta name="description" content="تواصل مع خدمة عملاء جاد." />
    <meta name="theme-color" content="#00451C" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="أتصل بنا | جاد" />
    <meta property="og:description" content="تواصل مع خدمة عملاء جاد." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="جاد" />
    <meta property="og:locale" content="ar_EG" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Jaad design system. Tailwind is COMPILED AT BUILD TIME by
         `npm run css` (config: tailwind.config.js) into tailwind.css. It used
         to be the Play CDN, which Tailwind itself warns against in production:
         that shipped ~120KB of JavaScript which then had to scan the DOM and
         generate the stylesheet on every visit, so nothing was styled until it
         finished — a flash of unstyled content on exactly the slow mobile
         connections this storefront is for. Now it is one 30KB cacheable file.

         ORDER IS LOAD-BEARING: tailwind.css first, styles.css second.
         styles.css contains rules whose whole purpose is to beat a utility
         ([hidden] !important, the focus ring re-armed over `outline-none`,
         the sticky-nav selector). Reverse these two and they stop working. -->
    <link rel="stylesheet" href="tailwind.css?v=12bbf6c5" />
    <link rel="stylesheet" href="styles.css?v=ab3a795c" />
    <!-- The client's 3D leaf mark as the tab icon (Ahmed, 2026-08-05) — the
         same spec-leaf.png the mega-panel bullets and product benefits use, so
         the favicon is a recognisable brand glyph rather than the white
         wordmark, which reads as a blank sliver at 16px. -->
    <link rel="icon" type="image/svg+xml" href="images/jaad/brand/favicon.svg" />
    <!-- The English dictionary, generated by build/i18n.py. Also `defer`, and
         listed FIRST: deferred scripts run in document order, so this has
         always defined window.JAAD_I18N by the time scripts.js boots and
         merges it. A plain script rather than a fetch, so the language switch
         still works from file://. -->
    <script defer src="i18n-en.js?v=b0628955"></script>
    <script defer src="scripts.js?v=049dd282"></script>
  </head>
  <body data-page="contact-us" data-path="/contact-us" class="antialiased bg-white">
    <!-- First focusable thing on the page. The header is three bands and a
         mega-menu, so a keyboard shopper otherwise tabbed through the whole
         of it on every page before reaching any content. Visually hidden
         until focused. -->
    <a href="#main" class="skip-link">تخطي إلى المحتوى</a>

    <!-- Shared header is injected here by scripts.js -->
    <div id="site-header"></div>

    <main id="main" tabindex="-1" class="overflow-x-clip">
      <section data-reveal class="contact-hero" data-contact-hero>
        <!-- data-contact-parallax: moved by initContactParallax, which is why
             the image is taller than its frame and inset past both edges — it
             needs somewhere to travel without ever showing a gap. -->
        <img src="images/jaad/site/contact-hero.jpg" alt="" aria-hidden="true"
             class="contact-hero__img" data-contact-parallax />
        <span class="contact-hero__veil" aria-hidden="true"></span>
        <div class="contact-hero__inner">
          <h1 class="contact-hero__title">أتصل بنا</h1>
          <p class="contact-hero__sub">
            لو عندك أي استفسار أو اقتراح، إحنا هنا. اختار الطريقة اللي تناسبك أو ابعتلنا رسالة وهنرد عليك في أقرب وقت.
          </p>
        </div>
      </section>

      <section data-reveal class="contact-body">
        <div class="contact-body__grid">
          <div class="contact-cards">
              <a href="tel:01200000000" class="contact-card">
                <span class="contact-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" class="w-5 h-5"><path d="M6.6 3.5 8.4 7l-1.9 1.9a12 12 0 0 0 5.6 5.6L14 12.6l3.5 1.8v3.3c0 1-.8 1.8-1.8 1.7A15.5 15.5 0 0 1 3.6 6.3c-.1-1 .7-1.8 1.7-1.8h1.3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
                <span class="contact-card__body">
                  <span class="contact-card__label">الخط الساخن</span>
                  <span class="contact-card__value latin">01200000000</span>
                </span>
              </a>
              <a href="mailto:info@jad.com" class="contact-card">
                <span class="contact-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" class="w-5 h-5"><rect x="3" y="5.5" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="m4.5 8 6.6 4.6a1.6 1.6 0 0 0 1.8 0L19.5 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
                <span class="contact-card__body">
                  <span class="contact-card__label">البريد الالكتروني</span>
                  <span class="contact-card__value latin">info@jad.com</span>
                </span>
              </a>
              <div class="contact-card contact-card--static">
                <span class="contact-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" class="w-5 h-5"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5V12l3 1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
                <span class="contact-card__body">
                  <span class="contact-card__label">مواعيد العمل</span>
                  <span class="contact-card__value">من السبت للخميس، من 9 صباحاً حتى 6 مساءً</span>
                </span>
              </div>
          </div>

          <form class="contact-form">
            <h2 class="contact-form__title">ابعتلنا رسالة</h2>
            <div class="gap-3 grid sm:grid-cols-2">

                <div class="flex flex-col gap-1.5 ">
                  <label for="name" class="font-medium text-muted text-sm">الاسم<span class="text-error">*</span></label>
                  <input type="text" id="name" name="name" required autocomplete="name"
                         value="" placeholder=""
                         class="bg-white border border-divider rounded-2xl px-4 h-12 w-full text-ink text-base placeholder:text-muted outline-none focus:border-cta transition-colors" />
                </div>

                <div class="flex flex-col gap-1.5 ">
                  <label for="phone" class="font-medium text-muted text-sm">رقم الهاتف<span class="text-error">*</span></label>
                  <input type="tel" id="phone" name="phone" required autocomplete="tel"
                         value="" placeholder=""
                         class="bg-white border border-divider rounded-2xl px-4 h-12 w-full text-ink text-base placeholder:text-muted outline-none focus:border-cta transition-colors" />
                </div>
            </div>

                <div class="flex flex-col gap-1.5 ">
                  <label for="email" class="font-medium text-muted text-sm">البريد الالكتروني<span class="text-error">*</span></label>
                  <input type="email" id="email" name="email" required autocomplete="email"
                         value="" placeholder=""
                         class="bg-white border border-divider rounded-2xl px-4 h-12 w-full text-ink text-base placeholder:text-muted outline-none focus:border-cta transition-colors" />
                </div>

                <div class="flex flex-col gap-1.5 ">
                  <label for="subject" class="font-medium text-muted text-sm">الموضوع</label>
                  <input type="text" id="subject" name="subject"
                         value="" placeholder=""
                         class="bg-white border border-divider rounded-2xl px-4 h-12 w-full text-ink text-base placeholder:text-muted outline-none focus:border-cta transition-colors" />
                </div>
            <div class="flex flex-col gap-1.5">
              <label for="message" class="font-medium text-muted text-sm">الرسالة<span class="text-error">*</span></label>
              <textarea id="message" name="message" rows="4" required
                        class="bg-white px-4 py-2.5 border border-divider focus:border-cta rounded-xl outline-none w-full text-ink text-sm transition-colors"></textarea>
            </div>
            <button type="submit" class="bg-cta hover:bg-cta-hover py-3 rounded-full font-semibold text-white text-sm transition-colors">أرسال</button>
          </form>
        </div>
      </section>
    </main>

    <!-- Shared footer is injected here by scripts.js -->
    <div id="site-footer"></div>
  </body>
</html>
