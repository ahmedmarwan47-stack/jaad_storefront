<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Don't cache the HTML page itself (Ahmed, 2026-08-19). Asset links carry
         a ?v=<hash> so CSS/JS always load fresh, but the browser was still
         serving a stale cached COPY OF THE PAGE (old markup persisted after a
         fix). Revalidating the HTML means every reload picks up the current
         page — and thus the current versioned asset links — with no hard-refresh. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>إنشاء حساب | جاد</title>
    <meta name="description" content="أنشئ حساب في جاد برقم موبايلك واكسب نقاط في محفظتك مع كل طلب." />
    <meta name="theme-color" content="#00451C" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="إنشاء حساب | جاد" />
    <meta property="og:description" content="أنشئ حساب في جاد برقم موبايلك واكسب نقاط في محفظتك مع كل طلب." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="جاد" />
    <meta property="og:locale" content="ar_EG" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Jaad design system. Tailwind is COMPILED AT BUILD TIME by
         `npm run css` (config: tailwind.config.js) into tailwind.css. It used
         to be the Play CDN, which Tailwind itself warns against in production:
         that shipped ~120KB of JavaScript which then had to scan the DOM and
         generate the stylesheet on every visit, so nothing was styled until it
         finished — a flash of unstyled content on exactly the slow mobile
         connections this storefront is for. Now it is one 30KB cacheable file.

         ORDER IS LOAD-BEARING: tailwind.css first, styles.css second.
         styles.css contains rules whose whole purpose is to beat a utility
         ([hidden] !important, the focus ring re-armed over `outline-none`,
         the sticky-nav selector). Reverse these two and they stop working. -->
    <link rel="stylesheet" href="tailwind.css?v=7da61fc4" />
    <link rel="stylesheet" href="styles.css?v=b0efb437" />
    <!-- The client's 3D leaf mark as the tab icon (Ahmed, 2026-08-05) — the
         same spec-leaf.png the mega-panel bullets and product benefits use, so
         the favicon is a recognisable brand glyph rather than the white
         wordmark, which reads as a blank sliver at 16px. -->
    <link rel="icon" type="image/svg+xml" href="images/jaad/brand/favicon.svg" />
    <!-- The English dictionary, generated by build/i18n.py. Also `defer`, and
         listed FIRST: deferred scripts run in document order, so this has
         always defined window.JAAD_I18N by the time scripts.js boots and
         merges it. A plain script rather than a fetch, so the language switch
         still works from file://. -->
    <script defer src="i18n-en.js?v=48b86045"></script>
    <script defer src="scripts.js?v=e5c2160c"></script>
  </head>
  <body data-page="register" data-path="/register" class="antialiased bg-white">
    <!-- First focusable thing on the page. The header is three bands and a
         mega-menu, so a keyboard shopper otherwise tabbed through the whole
         of it on every page before reaching any content. Visually hidden
         until focused. -->
    <a href="#main" class="skip-link">تخطي إلى المحتوى</a>

    <!-- Shared header is injected here by scripts.js -->
    <div id="site-header"></div>

    <main id="main" tabindex="-1" class="overflow-x-clip">

      <section data-reveal class="py-8 xl:py-12">
        <div class="items-stretch gap-6 xl:gap-8 grid grid-cols-1 max-w-[560px] mx-auto mx-auto px-4 max-w-[1536px]">
          
          <!-- The two auth cards are equal-height (items-stretch on the grid).
               Titles pin to the top (aligned); the sign-in page passes
               form_contents=True and its own flex-1 regions so the CTA centres
               on the same line as the create-account button (Ahmed, 2026-08-04). -->
          <div class="flex flex-col gap-6 bg-white shadow-custom4 p-8 xl:p-10 rounded-[20px] min-w-0">
            
            <h1 class="font-medium text-heading text-[32px] md:text-[40px] leading-[1.2] text-center">إنشاء حساب جديد</h1>
            <form class="flex flex-col gap-5" data-register-form>
              <div class="gap-4 grid sm:grid-cols-2">

                <div class="flex flex-col gap-1.5 ">
                  <label for="first-name" class="font-medium text-muted text-sm">الاسم الأول<span class="text-error">*</span></label>
                  <input type="text" id="first-name" name="first-name" required autocomplete="given-name"
                         value="" placeholder=""
                         class="bg-white border border-divider rounded-2xl px-4 h-12 w-full text-ink text-base placeholder:text-muted outline-none focus:border-cta transition-colors" />
                </div>

                <div class="flex flex-col gap-1.5 ">
                  <label for="last-name" class="font-medium text-muted text-sm">الاسم الاخير<span class="text-error">*</span></label>
                  <input type="text" id="last-name" name="last-name" required autocomplete="family-name"
                         value="" placeholder=""
                         class="bg-white border border-divider rounded-2xl px-4 h-12 w-full text-ink text-base placeholder:text-muted outline-none focus:border-cta transition-colors" />
                </div>
              </div>

                <div class="flex flex-col gap-1.5">
                  <label for="phone" class="font-medium text-muted text-sm">رقم الموبايل<span class="text-error">*</span></label>
                  <!-- Rebuilt clean (Ahmed, 2026-08-19): ONE rounded control, the
                       Egypt flag + +20 as a plain leading adornment on the SAME
                       white surface as the number. No inner cell and NO divider
                       rule — the old divider between the prefix and the input
                       read as a stray vertical line after "+20". The whole field
                       carries the green focus ring; the prefix is just text. -->
                  <div data-phone-field dir="ltr" class="flex items-center bg-white border border-divider focus-within:border-cta rounded-2xl transition-colors">
                    <span class="flex items-center gap-2 ps-4 pe-2.5 shrink-0 font-semibold text-ink text-base latin">
                      <img src="images/jaad/brand/flag-egypt.svg" alt="" class="w-5 h-5 rounded-full object-cover shrink-0" />
                      +20
                    </span>
                    <input type="tel" id="phone" name="phone" required autocomplete="tel" dir="ltr" value=""
                           placeholder="100 123 4567"
                           class="flex-1 bg-transparent py-3.5 pe-4 outline-none min-w-0 text-ink text-base latin" />
                  </div>
                  
                </div>

                <div class="flex flex-col gap-1.5 ">
                  <label for="email" class="font-medium text-muted text-sm">البريد الالكتروني<span class="text-error">*</span></label>
                  <input type="email" id="email" name="email" required autocomplete="email"
                         value="" placeholder=""
                         class="bg-white border border-divider rounded-2xl px-4 h-12 w-full text-ink text-base placeholder:text-muted outline-none focus:border-cta transition-colors" />
                </div>
              <!-- Birthday and gender are OPTIONAL (Ahmed, 2026-09-08) and
                   carry no asterisk, which is the only thing marking required
                   fields on this form — so the absence of one is the signal
                   that these two can be skipped. Neither control opens on a
                   value: the date selects start on their unit name and no
                   gender is pre-checked, or the form would submit answers the
                   shopper never gave. They sit AFTER the email, i.e. after
                   everything the account actually needs, so the required path
                   to "إنشاء حساب" is unbroken by fields nobody has to fill. -->

                <div class="flex flex-col gap-1.5">
                  <span class="font-medium text-muted text-sm">تاريخ الميلاد</span>
                  <div class="gap-3 grid grid-cols-2 sm:grid-cols-3">

                    <div>
                      <label for="birthday-day" class="sr-only">يوم</label>
                      <select id="birthday-day" name="birthday-day" autocomplete="bday-day"
                              class="select-control bg-white border border-divider rounded-2xl ps-4 h-12 w-full text-ink text-base outline-none focus:border-cta transition-colors">
                        <option value="" selected>يوم</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option>
                      </select>
                    </div>

                    <div>
                      <label for="birthday-month" class="sr-only">شهر</label>
                      <select id="birthday-month" name="birthday-month" autocomplete="bday-month"
                              class="select-control bg-white border border-divider rounded-2xl ps-4 h-12 w-full text-ink text-base outline-none focus:border-cta transition-colors">
                        <option value="" selected>شهر</option><option value="يناير">يناير</option><option value="فبراير">فبراير</option><option value="مارس">مارس</option><option value="أبريل">أبريل</option><option value="مايو">مايو</option><option value="يونيو">يونيو</option><option value="يوليو">يوليو</option><option value="أغسطس">أغسطس</option><option value="سبتمبر">سبتمبر</option><option value="أكتوبر">أكتوبر</option><option value="نوفمبر">نوفمبر</option><option value="ديسمبر">ديسمبر</option>
                      </select>
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                      <label for="birthday-year" class="sr-only">سنة</label>
                      <select id="birthday-year" name="birthday-year" autocomplete="bday-year"
                              class="select-control bg-white border border-divider rounded-2xl ps-4 h-12 w-full text-ink text-base outline-none focus:border-cta transition-colors">
                        <option value="" selected>سنة</option><option value="2010">2010</option><option value="2009">2009</option><option value="2008">2008</option><option value="2007">2007</option><option value="2006">2006</option><option value="2005">2005</option><option value="2004">2004</option><option value="2003">2003</option><option value="2002">2002</option><option value="2001">2001</option><option value="2000">2000</option><option value="1999">1999</option><option value="1998">1998</option><option value="1997">1997</option><option value="1996">1996</option><option value="1995">1995</option><option value="1994">1994</option><option value="1993">1993</option><option value="1992">1992</option><option value="1991">1991</option><option value="1990">1990</option><option value="1989">1989</option><option value="1988">1988</option><option value="1987">1987</option><option value="1986">1986</option><option value="1985">1985</option><option value="1984">1984</option><option value="1983">1983</option><option value="1982">1982</option><option value="1981">1981</option><option value="1980">1980</option><option value="1979">1979</option><option value="1978">1978</option><option value="1977">1977</option><option value="1976">1976</option><option value="1975">1975</option><option value="1974">1974</option><option value="1973">1973</option><option value="1972">1972</option><option value="1971">1971</option><option value="1970">1970</option><option value="1969">1969</option><option value="1968">1968</option><option value="1967">1967</option><option value="1966">1966</option><option value="1965">1965</option><option value="1964">1964</option><option value="1963">1963</option><option value="1962">1962</option><option value="1961">1961</option><option value="1960">1960</option><option value="1959">1959</option><option value="1958">1958</option><option value="1957">1957</option><option value="1956">1956</option><option value="1955">1955</option><option value="1954">1954</option><option value="1953">1953</option><option value="1952">1952</option><option value="1951">1951</option><option value="1950">1950</option><option value="1949">1949</option><option value="1948">1948</option><option value="1947">1947</option><option value="1946">1946</option><option value="1945">1945</option><option value="1944">1944</option><option value="1943">1943</option><option value="1942">1942</option><option value="1941">1941</option><option value="1940">1940</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="flex flex-col gap-1.5">
                  <span class="font-medium text-muted text-sm">النوع</span>
                  <div class="gap-3 grid grid-cols-2">
                  <label class="cursor-pointer">
                    <input type="radio" name="gender" value="female" class="peer sr-only" />
                    <span class="flex items-center gap-2.5 bg-white px-4 border border-divider peer-checked:border-cta rounded-2xl h-12 transition-colors">
                      <span class="radio-dot shrink-0"></span>
                      <span class="font-medium text-ink text-base">أنثى</span>
                    </span>
                  </label>
                  <label class="cursor-pointer">
                    <input type="radio" name="gender" value="male" class="peer sr-only" />
                    <span class="flex items-center gap-2.5 bg-white px-4 border border-divider peer-checked:border-cta rounded-2xl h-12 transition-colors">
                      <span class="radio-dot shrink-0"></span>
                      <span class="font-medium text-ink text-base">ذكر</span>
                    </span>
                  </label>
                  </div>
                </div>
              <label class="flex items-start gap-2 cursor-pointer">
                <input type="checkbox" required class="mt-1 accent-ink-800 w-4 h-4" />
                <span class="text-muted text-sm leading-6">
                  أوافق على <a href="terms-conditions.html" class="font-semibold text-cta underline">الشروط والأحكام</a>
                </span>
              </label>
              <button type="submit" class="bg-cta hover:bg-cta-hover py-4 rounded-full font-semibold text-white text-base transition-colors">إنشاء حساب</button>
              <p class="text-muted text-sm text-center">
                لديك حساب بالفعل؟ <a href="login.html" class="font-semibold text-cta underline">تسجيل الدخول</a>
              </p>
            </form>
            
                <div class="flex flex-col gap-3 pt-6 border-divider border-t">
                  <div class="gap-3 grid sm:grid-cols-2">
                    <button type="button" class="flex justify-center items-center gap-2 hover:bg-cream py-3 border border-divider rounded-full font-semibold text-ink text-sm transition-colors">
                      <svg viewBox="0 0 24 24" class="w-5 h-5"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.6-.2-2.3H12v4.5h6c-.3 1.4-1.1 2.6-2.3 3.4v2.8h3.7c2.2-2 3.4-5 3.4-8.4Z"/><path fill="#34A853" d="M12 23c3.1 0 5.7-1 7.6-2.8l-3.7-2.8c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v2.9C3.7 20.5 7.6 23 12 23Z"/><path fill="#FBBC05" d="M5.6 13.8c-.2-.7-.4-1.4-.4-2.3s.1-1.6.4-2.3V6.3H1.8C1 7.9.5 9.9.5 11.5s.4 3.6 1.3 5.2l3.8-2.9Z"/><path fill="#EA4335" d="M12 4.6c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.7 1.2 15.1 0 12 0 7.6 0 3.7 2.5 1.8 6.3l3.8 2.9c.9-2.7 3.4-4.6 6.4-4.6Z"/></svg><span>سجل بأستخدام جوجل</span>
                    </button>
                    <button type="button" class="flex justify-center items-center gap-2 hover:bg-cream py-3 border border-divider rounded-full font-semibold text-ink text-sm transition-colors">
                      <svg viewBox="0 0 24 24" fill="#1877F2" class="w-5 h-5"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06C2 17.06 5.66 21.21 10.44 22v-7.03H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.9 3.78-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.87h2.78l-.44 2.9h-2.34V22C18.34 21.21 22 17.06 22 12.06Z"/></svg><span>سجل بأستخدام فيسبوك</span>
                    </button>
                  </div>
                </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Shared footer is injected here by scripts.js -->
    <div id="site-footer"></div>
  </body>
</html>
